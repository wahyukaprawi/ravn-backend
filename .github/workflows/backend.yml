name: backend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  laravel:
    name: Laravel (PHP 8.5)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: ravn_test
          MYSQL_USER: ravn
          MYSQL_PASSWORD: secret
          MYSQL_ROOT_PASSWORD: root_secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot_secret --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_mysql, intl, zip, gd, bcmath, exif, pcntl, mbstring, curl
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Verify no environment files are tracked
        run: |
          tracked=$(git ls-files | grep -E '^\.env' | grep -v '^\.env\.example$' || true)
          if [ -n "$tracked" ]; then
            echo "::error::Environment files must never be tracked: $tracked"
            exit 1
          fi

      - name: Copy environment
        run: |
          cp .env.example .env
          php artisan key:generate --force
          echo "APP_KEY=$(grep '^APP_KEY=' .env | cut -d= -f2-)" >> $GITHUB_ENV

      - name: Check code style (Pint)
        run: vendor/bin/pint --test

      - name: Run migrations
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: ravn_test
          DB_USERNAME: ravn
          DB_PASSWORD: secret
          APP_ENV: testing
        run: php artisan migrate --force

      - name: Run tests
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: ravn_test
          DB_USERNAME: ravn
          DB_PASSWORD: secret
          APP_ENV: testing
        run: php artisan test --no-coverage
