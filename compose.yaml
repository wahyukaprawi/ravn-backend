name: ravn

x-app-env: &app-env
    APP_NAME: ${APP_NAME:-Ravn}
    APP_ENV: ${APP_ENV:-local}
    APP_DEBUG: ${APP_DEBUG:-true}
    APP_URL: ${APP_URL:-http://localhost:8080}
    APP_KEY: ${APP_KEY:-}
    APP_LOCALE: ${APP_LOCALE:-en}
    APP_FALLBACK_LOCALE: ${APP_FALLBACK_LOCALE:-en}
    APP_FAKER_LOCALE: ${APP_FAKER_LOCALE:-en_US}
    APP_MAINTENANCE_DRIVER: ${APP_MAINTENANCE_DRIVER:-file}
    BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
    LOG_CHANNEL: ${LOG_CHANNEL:-stack}
    LOG_STACK: ${LOG_STACK:-single}
    LOG_DEPRECATIONS_CHANNEL: ${LOG_DEPRECATIONS_CHANNEL:-null}
    LOG_LEVEL: ${LOG_LEVEL:-debug}
    DB_CONNECTION: ${DB_CONNECTION:-mysql}
    DB_HOST: mysql
    DB_PORT: 3306
    DB_DATABASE: ${DB_DATABASE:-ravn}
    DB_USERNAME: ${DB_USERNAME:-ravn}
    DB_PASSWORD: ${DB_PASSWORD:-secret}
    SESSION_DRIVER: ${SESSION_DRIVER:-database}
    SESSION_LIFETIME: ${SESSION_LIFETIME:-120}
    SESSION_ENCRYPT: ${SESSION_ENCRYPT:-false}
    SESSION_PATH: ${SESSION_PATH:-/}
    SESSION_DOMAIN: ${SESSION_DOMAIN:-null}
    BROADCAST_CONNECTION: ${BROADCAST_CONNECTION:-log}
    FILESYSTEM_DISK: ${FILESYSTEM_DISK:-local}
    QUEUE_CONNECTION: ${QUEUE_CONNECTION:-database}
    CACHE_STORE: ${CACHE_STORE:-database}
    MAIL_MAILER: ${MAIL_MAILER:-log}
    REDIS_CLIENT: ${REDIS_CLIENT:-phpredis}
    REDIS_HOST: ${REDIS_HOST:-redis}
    REDIS_PASSWORD: ${REDIS_PASSWORD:-null}
    REDIS_PORT: ${REDIS_PORT:-6379}

services:
    mysql:
        image: mysql:8.4
        environment:
            MYSQL_DATABASE: ${DB_DATABASE:-ravn}
            MYSQL_USER: ${DB_USERNAME:-ravn}
            MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
            MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
        command:
            - --character-set-server=utf8mb4
            - --collation-server=utf8mb4_unicode_ci
        ports:
            - "${DB_PORT_PUBLISHED:-3307}:3306"
        volumes:
            - mysql_data:/var/lib/mysql
            - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
        healthcheck:
            test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 30s
        restart: unless-stopped
        networks: [ravn]

    app:
        build:
            context: .
            dockerfile: Dockerfile
        depends_on:
            mysql:
                condition: service_healthy
        environment:
            <<: *app-env
        volumes:
            - .:/var/www/html
            - vendor:/var/www/html/vendor
            - storage:/var/www/html/storage
        healthcheck:
            test: ["CMD-SHELL", "ss -ltn | grep -q ':9000'"]
            interval: 10s
            timeout: 5s
            retries: 6
            start_period: 30s
        restart: unless-stopped
        networks: [ravn]

    nginx:
        image: nginx:stable-trixie
        depends_on:
            app:
                condition: service_started
        ports:
            - "${APP_PORT:-8080}:80"
        volumes:
            - ./public:/var/www/html/public:ro
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        healthcheck:
            test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/up || exit 1"]
            interval: 10s
            timeout: 5s
            retries: 6
            start_period: 30s
        restart: unless-stopped
        networks: [ravn]

    test:
        build:
            context: .
            dockerfile: Dockerfile
        profiles: [test]
        depends_on:
            mysql:
                condition: service_healthy
        environment:
            <<: *app-env
            APP_ENV: testing
            DB_DATABASE: ${DB_DATABASE_TESTING:-ravn_test}
            BCRYPT_ROUNDS: 4
        volumes:
            - .:/var/www/html
            - vendor:/var/www/html/vendor
            - storage:/var/www/html/storage
        command: ["php", "artisan", "test"]
        networks: [ravn]

    queue:
        build:
            context: .
            dockerfile: Dockerfile
        profiles: [worker]
        depends_on:
            mysql:
                condition: service_healthy
        environment:
            <<: *app-env
        volumes:
            - .:/var/www/html
            - vendor:/var/www/html/vendor
            - storage:/var/www/html/storage
        command: ["supervisord", "-c", "/etc/supervisor/supervisord.conf", "-n"]
        restart: unless-stopped
        networks: [ravn]

    scheduler:
        build:
            context: .
            dockerfile: Dockerfile
        profiles: [worker]
        user: "33:33"
        depends_on:
            mysql:
                condition: service_healthy
        environment:
            <<: *app-env
        volumes:
            - .:/var/www/html
            - vendor:/var/www/html/vendor
            - storage:/var/www/html/storage
        command: ["php", "artisan", "schedule:work"]
        restart: unless-stopped
        networks: [ravn]

networks:
    ravn:
        driver: bridge

volumes:
    mysql_data:
    vendor:
    storage:
